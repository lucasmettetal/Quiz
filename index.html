<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tilt — quiz interactifs en direct. Crée, lance, joue depuis ton téléphone." />
    <meta name="theme-color" content="#17142b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tilt — le quiz qui fait tilt</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      try {
        var p = localStorage.getItem('tilt.theme')
        var dark = p === 'dark' || ((!p || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
